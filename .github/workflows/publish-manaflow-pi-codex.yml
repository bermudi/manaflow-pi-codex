name: Publish manaflow-pi-codex

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" configured for the npm trusted
    # publisher (npmjs.com/package/@bermudi/pi-codex → Trusted Publisher).
    # The OIDC token only carries the environment claim when the job
    # declares it; a mismatch fails publish with 404.
    environment: npm-publish
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Debug OIDC token claims
        run: |
          for aud in sigstore npm; do
            echo "=== audience: $aud ==="
            curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$aud" | \
              node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const v=JSON.parse(d).value.split('.');const p=JSON.parse(Buffer.from(v[1],'base64url'));console.log(JSON.stringify({sub:p.sub,environment:p.environment,iss:p.iss,job_workflow_ref:p.job_workflow_ref},null,2))})"
          done

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          echo "NODE_AUTH_TOKEN type: $(echo "$NODE_AUTH_TOKEN" | awk -F. '{print NF}') segments, len=$(echo -n "$NODE_AUTH_TOKEN" | wc -c)"
          echo "npm whoami: $(npm whoami 2>&1)"
          npm access ls-collaborators @bermudi/pi-codex 2>&1 || true
          export NPM_CONFIG_LOGLEVEL=verbose
          npm publish --provenance --access public || {
            echo "===== NPM DEBUG LOG ====="
            cat "$(ls -t /home/runner/.npm/_logs/*-debug-0.log | head -1)"
            exit 1
          }
